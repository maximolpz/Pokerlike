 ["boss","Derrotá {n} Jefes",[[1,0],[5,1],[15,2]]],
 ["runs","Ganá {n} partidas completas",[[1,2],[3,3]]],
 ["h_pa","Jugá {n} Parejas",[[10,0],[50,1]]],["h_tp","Jugá {n} Dobles parejas",[[8,0],[40,1]]],["h_tk","Jugá {n} Tríos",[[5,0],[30,1]]],
 ["h_st","Jugá {n} Escaleras",[[3,0],[20,1],[60,2]]],["h_fl","Jugá {n} Colores",[[3,0],[20,1],[60,2]]],["h_fh","Jugá {n} Full",[[2,0],[10,1],[40,2]]],
 ["h_fk","Jugá {n} Pókers",[[1,1],[5,2],[15,3]]],["h_sf","Jugá {n} Escaleras de color",[[1,2],[3,3]]],
 ["big","Hacé una mano de {n} puntos",[[300,0],[2000,1],[20000,2],[200000,3]]],
 ["dice","Tirá el dado {n} veces",[[1,0],[5,1],[15,2]]],["buys","Comprá {n} cosas en la tienda",[[5,0],[25,1],[80,2]]],
 ["packs","Abrí {n} sobres holográficos",[[1,0],[5,1],[15,2]]],["flips","Girá {n} cartas con el Giro",[[5,0],[30,1],[100,2]]],
 ["j5","Tené 5 jokers a la vez",[[1,1]]]
];
const MS=MT.flatMap(([k,t,ti])=>ti.map(([n,r])=>({id:k+n,k,n,r,txt:t.replace("{n}",n)})));
const CU={tab:"c",th:"all",pg:0,got:-1};
function claim(id){
 const m=MS.find(x=>x.id==id);if(!m||COL.claimed[id]||(COL.st[m.k]||0)<m.n)return;
 COL.claimed[id]=1;const pool=CR.map((c,i)=>i).filter(i=>CR[i].r==RARN[m.r]),un=pool.filter(i=>!COL.cards[i]),a=un.length?un:pool,i=a[Math.random()*a.length|0];
 COL.cards[i]=(COL.cards[i]||0)+1;saveCol();CU.got=i;showCol();
}
function colH(){
 const own=Object.keys(COL.cards).length,done=m=>(COL.st[m.k]||0)>=m.n,rdy=MS.filter(m=>!COL.claimed[m.id]&&done(m)).length,g=CU.got;CU.got=-1;
 const tabs=[["c","Cartas"],["d","Dorsos"],["m","Misiones"+(rdy?` (${rdy}🎁)`:"")]].map(([k,t])=>`<button class="${CU.tab==k?"b4":"b1"}" style="padding:8px 12px" onclick="CU.tab='${k}';CU.pg=0;showCol()">${t}</button>`).join(" ");
 let body="";
 if(CU.tab=="c"){
  const list=CR.map((c,i)=>i).filter(i=>CU.th=="all"||CR[i].th==CU.th),pgs=Math.ceil(list.length/12),pg=Math.min(CU.pg,pgs-1);
  const chips=[["all","Todas"],["c","🎰 Casino"],["p","♠ Póker"],["b","🎱 Bingo"]].map(([k,t])=>`<button class="${CU.th==k?"b4":"b1"}" style="padding:5px 10px;font-size:13px" onclick="CU.th='${k}';CU.pg=0;showCol()">${t}</button>`).join(" ");
  body=`<p class="center">${own}/${CR.length} obtenidas</p><div class="center">${chips}</div><div class="grid">${list.slice(pg*12,pg*12+12).map(i=>tcgH(i,!COL.cards[i],COL.cards[i]||0)).join("")}</div><div class="center"><button class="b1" ${pg?"":"disabled"} onclick="CU.pg=${pg-1};showCol()">◀</button> Página ${pg+1}/${pgs} <button class="b1" ${pg<pgs-1?"":"disabled"} onclick="CU.pg=${pg+1};showCol()">▶</button></div>`;
 }else if(CU.tab=="d"){
  body=`<div class="grid">${[-1,0,1,2,3].map(s=>{const has=s<0||COL.backs[s];return`<div class="center"><div class="bk" style='background:${s<0?DEFBACK:hbUrl(s)} center/100% 100%'></div><small>${s<0?"Clásico":BN[s]}</small><br>${has?(COL.back==s?"✔ En uso":`<button class="b3" style="padding:4px 12px" onclick="equip(${s})">Usar</button>`):"<small>🔒 Bloqueado</small>"}</div>`}).join("")}</div><p class="note">Los dorsos holográficos salen en los Sobres Dorso Holo de la tienda.</p>`;
 }else{
  const rk=m=>COL.claimed[m.id]?2:done(m)?0:1;
  body=`<p class="note">Cumplí misiones y reclamá una carta de la rareza indicada. Las cartas también salen en los Sobres PokerLike Holo de la tienda.</p>`+MS.slice().sort((a,b)=>rk(a)-rk(b)).map(m=>{const v=Math.min(COL.st[m.k]||0,m.n),cl=COL.claimed[m.id];
   return`<div class="ms ${cl?"cl":""}"><div style="flex:1"><b>${m.txt}</b><br><small>Premio: carta ${RARN[m.r]} · ${v}/${m.n}</small><div class="bar"><i style="width:${v/m.n*100}%"></i></div></div>${cl?"✔":done(m)?`<button class="b3" style="padding:6px 12px" onclick="claim('${m.id}')">Reclamar</button>`:"🔒"}</div>`}).join("");
 }
 return`<h2>🎨 Colección</h2><div class="center">${tabs}</div>${g>=0?`<div class="center"><p class="gold">¡Misión cumplida! Obtuviste:</p>${tcgH(g,false,0)}</div>`:""}${body}`;
}
function showCol(){const g=$("guide");g.innerHTML=`<div class="g"><button class="x" onclick="closeGuide(false)">✕</button>${colH()}<div class="center" style="margin-top:14px"><button class="b3" onclick="closeGuide(false)">Cerrar</button></div></div>`;g.style.display="block"}
function equip(s){COL.back=s;saveCol();applyBack();showCol()}
(()=>{let t="",f="";
 for(let x=8;x<=92;x+=6)t+=`<path d='M${x} 5l3 6 3-6zM${x} 139l3-6 3 6z' fill='#fff'/>`;
 for(let y=14;y<=128;y+=6)t+=`<path d='M5 ${y}l6 3-6 3zM95 ${y}l-6 3 6 3z' fill='#fff'/>`;
 for(let k=0;k<8;k++)f+=`<ellipse cx='50' cy='57' rx='${k%2?4:6}' ry='${k%2?11:15}' transform='rotate(${k*45} 50 72)' fill='${k%2?"#fff":"none"}' stroke='#fff' stroke-width='1.3'/>`;
 const sc=`<path d='M50 34C34 22 22 38 34 46M50 34C66 22 78 38 66 46M50 34V44' fill='none' stroke='#fff' stroke-width='1.6'/><circle cx='50' cy='46' r='2' fill='#fff'/>`;
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 144'><rect width='100' height='144' rx='7' fill='#25319a'/><rect x='2' y='2' width='96' height='140' rx='6' fill='none' stroke='#fff' stroke-width='2'/>${t}<rect x='14' y='17' width='72' height='110' fill='none' stroke='#fff' stroke-width='1.2'/>${sc}<g transform='rotate(180 50 72)'>${sc}</g>${f}<circle cx='50' cy='72' r='8' fill='#fff'/><circle cx='50' cy='72' r='4' fill='#25319a'/><path d='M30 56v-8h8M70 56v-8h-8M30 88v8h8M70 88v8h-8' fill='none' stroke='#fff' stroke-width='1.5'/></svg>`;
 DEFBACK=`url("data:image/svg+xml,${encodeURIComponent(svg).replace(/'/g,"%27")}")`;applyBack()})();
renderDif();G={phase:"intro"};
</script>
