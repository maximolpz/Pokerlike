<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Póker Roguelike – clon de Balatro</title>
<style>
:root{--bg:#0f3d2e;--panel:#0a2a20;--ink:#f4f1e6;--red:#d6453d;--blue:#3b82f6;--gold:#f5c542}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 30%,#14543f,var(--bg) 70%);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh}
#app{max-width:980px;margin:0 auto;padding:12px}
.top{display:flex;gap:10px;flex-wrap:wrap}
.box{background:var(--panel);border:2px solid #ffffff22;border-radius:10px;padding:8px 12px;flex:1;min-width:130px}
.box b{display:block;font-size:22px}
.box small{opacity:.7}
.gold{color:var(--gold)}
.bar{height:10px;background:#0006;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;min-height:110px;align-items:center}
.joker{background:#3b2a63;border:2px solid #a78bfa;border-radius:8px;padding:6px;width:118px;font-size:12px;text-align:center}
.joker b{display:block;font-size:13px;color:#e9d5ff}
.card{width:64px;height:92px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:24px;cursor:pointer;transition:transform .15s;user-select:none;box-shadow:0 3px 6px #0006}
.card.r{color:var(--red)}
.card span{font-size:26px}
.card.sel{transform:translateY(-18px);outline:3px solid var(--gold)}
.card.played{cursor:default;animation:pop .4s}
@keyframes pop{from{transform:scale(1.3)}to{transform:scale(1)}}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 20px;cursor:pointer;color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.b1{background:var(--blue)}.b2{background:var(--red)}.b3{background:#16a34a}.b4{background:#7c3aed}
.info{text-align:center;min-height:56px;font-size:18px}
.info .calc{font-size:26px;font-weight:800}
.chips{color:#60a5fa}.mult{color:#f87171}
.shop .item{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:10px;width:170px;text-align:center}
.shop .item p{font-size:13px;margin:6px 0;min-height:48px}
table{margin:auto;border-collapse:collapse;font-size:13px}
td,th{padding:3px 10px;border-bottom:1px solid #fff2}
.center{text-align:center}
#guide{position:fixed;inset:0;background:#000d;z-index:9;overflow:auto;padding:14px}
#guide .g{max-width:760px;margin:auto;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:18px 22px;line-height:1.5}
#guide h2{margin-top:0}#guide h3{color:var(--gold);margin:14px 0 4px}#guide p,#guide li{font-size:15px;margin:3px 0}
#gbtn{position:fixed;right:10px;bottom:10px;z-index:5;background:#7c3aed}
body.lost{background:#262626}
body.lost #app>*:not(.lostbox){filter:grayscale(1) brightness(.65);pointer-events:none;transition:filter .6s}
.lostbox h2{color:#ef4444;font-size:46px;margin:10px 0;text-shadow:0 0 18px #ef444488}
.mcs{white-space:nowrap}
.mc{display:inline-block;width:27px;height:36px;line-height:36px;margin:2px 1px;background:#fff;color:#111;border-radius:4px;font-size:11px;font-weight:700;text-align:center;letter-spacing:-1px}
.mc.r{color:var(--red)}.mc.dim{opacity:.4}
body.shop{--panel:#1a1208;background:radial-gradient(circle,#0000 30%,#000d 100%),var(--shopbg) #0d0905;background-size:auto,240px 240px}
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle,#0000 30%,#000d 100%),var(--shopbg) #0d0905;background-size:auto,240px 240px}
#start img{width:min(92vw,660px);image-rendering:pixelated}
#start button{background:#f5c542;color:#1a1208;font-size:30px;padding:14px 64px;border-radius:10px;box-shadow:0 6px 0 #b8861a;letter-spacing:3px}
#start button:active{transform:translateY(4px);box-shadow:0 2px 0 #b8861a}
.win h1{font-size:40px;margin:20px 0 6px}
.card{position:relative;overflow:hidden}
.card.e-b::before,.card.e-m::before,.card.e-g::before,.card.e-o::before{position:absolute;top:1px;right:2px;font-size:15px;filter:drop-shadow(0 1px 1px #0008);animation:bob 1.6s ease-in-out infinite}
.card.e-b::before{content:"🪙"}.card.e-m::before{content:"🔥";animation-name:pulse}.card.e-g::before{content:"💎"}.card.e-o::before{content:"⭐";animation-name:spin}
.card.e-b::after,.card.e-m::after,.card.e-g::after,.card.e-o::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fffa 50%,transparent 65%);animation:sheen 2.8s infinite;pointer-events:none}
.card.e-b{box-shadow:inset 0 0 0 3px #f5c542,0 3px 6px #0006}
.card.e-m{box-shadow:inset 0 0 0 3px #ef4444,0 3px 6px #0006}
.card.e-o{box-shadow:inset 0 0 0 3px #fbbf24,0 0 14px #f5c542}
.card.e-g{background:linear-gradient(135deg,#fff,#d9f7ff);animation:chroma .9s steps(2) infinite;box-shadow:-3px 0 0 #ff2d5588,3px 0 0 #22d3ee88}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes pulse{50%{transform:scale(1.3)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes chroma{0%{text-shadow:-2px 0 #ff2d55,2px 0 #22d3ee}50%{text-shadow:2px 1px #ff2d55,-2px -1px #22d3ee}}
.card.back{background:var(--backbg) center/100% 100% no-repeat,#25319a;color:transparent;font-size:0;box-shadow:0 3px 6px #0006}
.card.flip{animation:flipIn .45s}
@keyframes flipIn{from{transform:rotateY(90deg)}to{transform:none}}
.card.rv{box-shadow:inset 0 0 0 3px #a78bfa,0 0 14px #a78bfa;animation:glow 1.6s ease-in-out infinite}
.card.rv::before{content:"👁️";position:absolute;top:1px;left:2px;font-size:14px}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px #c4b5fd,0 0 22px #a78bfa}}
.lg{font-size:12px;opacity:.8;margin-top:4px;font-weight:400}
.note{font-size:12px;opacity:.85;max-width:560px;margin:8px auto;line-height:1.5}
.hname{font-size:34px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 0 #000a}
.cv{position:absolute;bottom:3px;font-size:10px;font-weight:800;font-style:normal;line-height:1;text-shadow:none}
.cv.l{left:4px;color:#2563eb}.cv.m{right:4px;color:#dc2626}
#hbtn{position:fixed;right:100px;bottom:10px;z-index:5;background:#0ea5e9}
</style>
</head>
<body>
<div id="start"><img src="Logo_pixelado_PokerLike.png" alt="PokerLike"><button onclick="startGame()">JUGAR</button></div><div id="app"></div><div id="guide" style="display:none"></div><button id="hbtn" onclick="showHands()">📊 Manos</button><button id="gbtn" onclick="showGuide(false)">📖 Guía</button>
<script>
const SU=["♠","♥","♦","♣"],RK={11:"J",12:"Q",13:"K",14:"A"};
// [fichas, multi, +fichas/nivel, +multi/nivel, nombre]
const HT={hi:[5,1,10,1,"Carta alta"],pa:[10,2,15,1,"Pareja"],tp:[20,2,20,1,"Doble pareja"],tk:[30,3,20,2,"Trío"],
 st:[30,4,30,3,"Escalera"],fl:[35,4,15,2,"Color"],fh:[40,4,25,2,"Full"],fk:[60,7,30,3,"Póker"],sf:[100,8,40,4,"Escalera de color"]};
const HC={hi:"#cbd5e1",pa:"#93c5fd",tp:"#67e8f9",tk:"#86efac",st:"#fde047",fl:"#fdba74",fh:"#f9a8d4",fk:"#f87171",sf:"#c084fc"};
const PAIRY=["pa","tp","tk","fh","fk"];
const BL=[["Ronda 1",1,3],["Ronda 2",1.5,4],["Jefe",2,5]];
const ANTE=[300,800,2000,5000,11000,20000,35000,50000];
// Jokers: f(ctx) -> [fichas, multi, xmulti]
const cnt=(c,fn)=>c.sc.filter(fn).length;
const suitJ=(n,s,t)=>({n,d:`+3 Multi por cada ${t} que puntúe`,c:5,f:c=>[0,3*cnt(c,x=>x.s==s),1]});
const JK=[
 {n:"Joker",d:"+4 Multi",c:2,f:()=>[0,4,1]},
 {n:"Joker Jolly",d:"+8 Multi si hay una pareja",c:3,f:c=>[0,c.pr?8:0,1]},
 {n:"Joker Astuto",d:"+50 Fichas si hay una pareja",c:3,f:c=>[c.pr?50:0,0,1]},
 {n:"Joker Dúo",d:"X2 Multi si hay una pareja",c:6,f:c=>[0,0,c.pr?2:1]},
 {n:"Medio Joker",d:"+20 Multi si juegas 3 cartas o menos",c:4,f:c=>[0,c.n<=3?20:0,1]},
 {n:"Estandarte",d:"+30 Fichas por descarte restante",c:5,f:c=>[30*G.disc,0,1]},
 {n:"Cara Fea",d:"+30 Fichas por figura que puntúe",c:4,f:c=>[30*cnt(c,x=>x.r>10&&x.r<14),0,1]},
 {n:"Abstracto",d:"+3 Multi por Joker que tengas",c:4,f:()=>[0,3*G.jokers.length,1]},
 {n:"Fibonacci",d:"+8 Multi por A,2,3,5,8 que puntúe",c:7,f:c=>[0,8*cnt(c,x=>[14,2,3,5,8].includes(x.r)),1]},
 {n:"Toro",d:"+2 Fichas por cada $ que tengas",c:6,f:()=>[2*G.money,0,1]},
 {n:"Joker Maniático",d:"X1.5 Multi con Escalera o Color",c:6,f:c=>[0,0,["st","fl","sf"].includes(c.t)?1.5:1]},
 suitJ("Codicioso","2".length+1,"Diamante"),suitJ("Lujurioso",1,"Corazón"),suitJ("Colérico",0,"Pica"),suitJ("Glotón",3,"Trébol")
];
JK[11].f=c=>[0,3*cnt(c,x=>x.s==2),1];
const HUM=[["Joker Clásico","+4 Multi. Sencillo, honesto y sin letra chica."],["Joker Cita Doble","+8 Multi si hay una pareja. El amor paga."],["Joker Pícaro","+50 Fichas si hay una pareja. Jura que no tocó nada."],["Dúo Dinámico","X2 Multi si hay una pareja. Mejor juntos que separados."],["Medio Joker","+20 Multi si jugás 3 cartas o menos. Hace más con menos."],["Estandarte del Ahorrista","+30 Fichas por cada descarte que te sobre, con cualquier mano. Premio al que no gasta."],["Cara de Póker","+30 Fichas por figura que puntúe. Nunca sabés qué piensa."],["Joker Club de Fans","+3 Multi por cada Joker que tengas. Más amigos, más aplausos."],["Joker Matemático","+8 Multi por A,2,3,5,8 que puntúe. Presume que sabe contar."],["Toro Millonario","+2 Fichas por cada $ que tengas. Cuanto más rico, más fuerte."],["Joker Escalador","X1.5 Multi con Escalera o Color. Siempre busca el próximo nivel."],["Joker Brillitos","+3 Multi por cada Diamante que puntúe. Ama todo lo que brilla."],["Joker Romántico","+3 Multi por cada Corazón que puntúe. Todo lo hace con amor."],["Joker Pala","+3 Multi por cada Pica que puntúe. Cava que cava."],["Joker Jardinero","+3 Multi por cada Trébol que puntúe. Lo que plantás, florece."]];
JK.forEach((j,i)=>{j.n=HUM[i][0];j.d=HUM[i][1]});
const PLN={hi:"Planeta Solitario",pa:"Planeta Pareja Feliz",tp:"Planeta Doble Cita",tk:"Planeta Tres Mosqueteros",st:"Planeta Escalera al Cielo",fl:"Planeta Monocolor",fh:"Planeta Banquete",fk:"Planeta Cuatro Fantásticos",sf:"Planeta Súper Escalera"};
const PLJ={hi:"Para los que juegan en solitario.",pa:"Dos corazones, un solo destino.",tp:"Doble cita, doble premio.",tk:"Tres es compañía, y paga.",st:"Un escalón a la vez.",fl:"Todo del mismo color, como un uniforme.",fh:"Hay mesa para todos.",fk:"Cuatro iguales: insuperable.",sf:"Lo mejor de dos mundos."};
let G={};
const $=id=>document.getElementById(id);
function newRun(){
 G={ante:1,bi:0,money:4,jokers:[],lv:{},phase:"play",msg:"",shop:[],sel:[],played:[],rr:3,flipCd:0};
 for(const k in HT)G.lv[k]=0;
 G.cards=[];let id=0;for(let q=0;q<4;q++)for(let r=2;r<=14;r++)G.cards.push({r,s:q,id:id++});
 startBlind();
}
function startBlind(){
 const d=G.cards.map(c=>({...c}));
 for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 Object.assign(G,{deck:d,hand:[],sel:[],played:[],hands:4,disc:3,score:0,phase:"play",
  target:Math.round(ANTE[G.ante-1]*BL[G.bi][1]),msg:"Selecciona hasta 5 cartas. Tocá las cartas boca abajo para darles vuelta."});
 draw();render();
}
function draw(){while(G.hand.length<8&&G.deck.length){const c=G.deck.pop();if(Math.random()<.25)c.down=1;G.hand.push(c)}sortHand()}
let sortBy="r";
function sortHand(){G.hand.sort((a,b)=>a.down||b.down?(a.down?1:0)-(b.down?1:0):sortBy=="r"?b.r-a.r||a.s-b.s:a.s-b.s||b.r-a.r)}
function ev(cs){
 const m={};cs.forEach(c=>m[c.r]=(m[c.r]||0)+1);
 const g=Object.values(m).sort((a,b)=>b-a),r=cs.map(c=>c.r).sort((a,b)=>a-b);
 const fl=cs.length==5&&cs.every(c=>c.s==cs[0].s);
 const st=cs.length==5&&g[0]==1&&(r[4]-r[0]==4||r.join()=="2,3,4,5,14");
 let t="hi",all=false;
 if(st&&fl){t="sf";all=1}else if(g[0]==4)t="fk";else if(g[0]==3&&g[1]==2){t="fh";all=1}
 else if(fl){t="fl";all=1}else if(st){t="st";all=1}else if(g[0]==3)t="tk";
 else if(g[0]==2&&g[1]==2)t="tp";else if(g[0]==2)t="pa";
 let sc;
 if(all)sc=cs;else if(t=="hi")sc=[cs.reduce((a,b)=>b.r>a.r?b:a)];
 else sc=cs.filter(c=>m[c.r]>=(t=="fk"?4:t=="tk"?3:2));
 return{t,sc,pr:PAIRY.includes(t)};
}
function calc(cs){
 const e=ev(cs),h=HT[e.t],l=G.lv[e.t],lg=[];
 let ch=h[0]+l*h[2],mu=h[1]+l*h[3];
 lg.push(`${h[4]} base: ${ch}f ×${mu}`);
 e.sc.forEach(c=>{const v=c.r>13?11:c.r>10?10:c.r;ch+=v;let t=`${RK[c.r]||c.r}${SU[c.s]} +${v}f`;
  if(c.rv){ch+=25;mu+=3;t+=" · 👁️ +25f +3m"}
  if(c.e=="b"){ch+=30;t+=" · Gordita +30f"}
  if(c.e=="m"){mu+=4;t+=" · Turbo +4m"}
  if(c.e=="g"){mu*=1.5;t+=" · Cristal ×1.5"}
  if(c.e=="o")t+=" · Ricachona +$2";
  lg.push(t)});
 const ctx={...e,n:cs.length};
 G.jokers.forEach(j=>{const[a,b,x]=j.f(ctx);ch+=a;mu+=b;mu*=x;
  const t=[a?`+${a}f`:"",b?`+${b}m`:"",x!=1?`×${x}`:""].filter(Boolean).join(" ");if(t)lg.push(`${j.n} ${t}`)});
 return{...e,lg,gold:e.sc.filter(c=>c.e=="o").length,ch,mu:Math.round(mu*10)/10,total:Math.round(ch*mu)};
}
function toggle(i){
 if(G.phase!="play")return;
 const c=G.hand[i];
 if(c.down){delete c.down;c.fl=1;setTimeout(()=>delete c.fl,500);sfx("girar.mp3");
  if(!G.flipCd){c.rv=1;G.flipCd=2;G.msg="👁️ ¡Giro con bonus! Esa carta da +25 Fichas y +3 Multi si puntúa. Recarga: 2 rondas."}
  else G.msg="Carta revelada (sin bonus: el Giro se está recargando).";
  render();return}
 const k=G.sel.indexOf(i);
 if(k>=0)G.sel.splice(k,1);
 else if(G.sel.length<5){G.sel.push(i);sfx("select.mp3")}
 render();
}
function play(){
 if(!G.sel.length||G.hands<1||G.phase!="play")return;
 const cs=G.sel.map(i=>G.hand[i]),r=calc(cs);
 sfx("colocar.mp3");G.score+=r.total;G.money+=2*r.gold;G.hands--;G.played=cs;
 G.hand=G.hand.filter((_,i)=>!G.sel.includes(i));G.sel=[];
 G.msg=`<span class="calc"><span class="chips">${r.ch}</span> × <span class="mult">${r.mu}</span> = <span class="gold">${r.total}</span></span><br><span class="hname" style="color:${HC[r.t]}">${HT[r.t][4]}</span>${r.gold?` <span class="gold">+$${2*r.gold}</span>`:""}`;
 draw();
 if(G.score>=G.target){if(G.flipCd>0)G.flipCd--;G.phase="won";sfx("ganar.mp3");render();return}
 if(G.hands==0){G.phase="lost";sfx("derrota2.mp3")}
 render();
}
function discard(){
 if(!G.sel.length||G.disc<1||G.phase!="play")return;
 G.disc--;G.hand=G.hand.filter((_,i)=>!G.sel.includes(i));G.sel=[];G.played=[];
 draw();G.msg="Cartas descartadas.";render();
}
const PC={c:4,a:4,j:6},PN={c:"Sobre Cósmico",a:"Sobre Misterioso",j:"Sobre de Bufones"};
const ENH={b:["Carta Gordita","+30 Fichas al puntuar. Viene bien cargada."],m:["Carta Turbo","+4 Multi al puntuar. Le pusieron cohete."],g:["Carta de Cristal","X1.5 Multi al puntuar. Frágil por fuera, potente por dentro."],o:["Carta Ricachona","+$2 al puntuar. Siempre deja propina."]};
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
function mkPack(p){return{p,o:p=="c"?pick(Object.keys(HT),3):p=="a"?pick(Object.keys(ENH),3):pick(JK,3)}}
function iN(it){return it.k=="j"?it.j.n:it.k=="p"?PLN[it.t]:PN[it.p]}
function iD(it){return it.k=="j"?it.j.d:it.k=="p"?`Sube ${HT[it.t][4]} (nv ${G.lv[it.t]}): +${HT[it.t][2]} Fichas y +${HT[it.t][3]} Multi. ${PLJ[it.t]}`:"Elegí 1 de 3 "+(it.p=="c"?"planetas. Viaje sin escalas.":it.p=="a"?"mejoras: se aplican a 2 cartas al azar de tu mazo. Sorpresa garantizada.":"jokers. Prometen portarse bien.")}
function packH(){
 const P=G.pack;
 return`<h2 class="center">🎁 ${PN[P.p]} – elegí 1 (costo $${PC[P.p]})</h2><div class="row shop">${P.o.map((x,i)=>`<div class="item"><b>${P.p=="c"?PLN[x]:P.p=="a"?ENH[x][0]:x.n}</b><p>${P.p=="c"?`Nivel ${G.lv[x]} → ${G.lv[x]+1}. ${PLJ[x]}`:P.p=="a"?ENH[x][1]:x.d}</p><button class="b3" ${P.p=="j"&&G.jokers.length>=5?"disabled":""} onclick="choose(${i})">${P.p=="j"&&G.jokers.length>=5?"Sin espacio":"Elegir"}</button></div>`).join("")}</div>
 <div class="center"><button class="b2" onclick="G.pack=null;render()">Volver a la tienda</button></div><h3 class="center">Tus jokers ${G.jokers.length}/5</h3><div class="row">${jokersH(0)}</div>`;
}
function choose(i){
 const P=G.pack,x=P.o[i];
 G.money-=PC[P.p];G.shop.splice(P.idx,1);
 if(P.p=="c"){G.lv[x]++;G.shopMsg=`${HT[x][4]} sube a nivel ${G.lv[x]}.`}
 else if(P.p=="a"){
  const pool=G.cards.filter(c=>!c.e),src=(pool.length>=2?pool:G.cards),ch=pick(src,2);
  ch.forEach(c=>c.e=x);G.shopMsg=`${ENH[x][0]} aplicada a: ${ch.map(c=>(RK[c.r]||c.r)+SU[c.s]).join(", ")}.`;
 }else{G.jokers.push({...x,uid:++UID});G.shopMsg=`Obtuviste ${x.n}.`}
 G.pack=null;sfx();render();
}
function cash(){
 const pay=BL[G.bi][2]+G.hands+Math.min(5,Math.floor(G.money/5));
 G.money+=pay;G.payout=pay;G.phase="shop";G.shopMsg="";G.rr=3;G.shop=[];fillShop();render();
}
function fillShop(){
 G.shop=[];
 for(let i=0;i<2;i++){const j=JK[Math.random()*JK.length|0];G.shop.push({k:"j",j,c:j.c})}
 const t=Object.keys(HT)[Math.random()*9|0];
 G.shop.push({k:"p",t,c:3});
 const pk=["c","a","j"];for(let i=0;i<2;i++){const p=pk[Math.random()*3|0];G.shop.push({k:"k",p,c:PC[p]})}
}
let UID=0;
function sfx(f="compra.mp3",v=1){try{const a=new Audio(f);a.volume=v;a.play().catch(()=>{})}catch(e){}}
function buy(i){
 const it=G.shop[i];
 if(!it||G.money<it.c)return;
 if(it.k=="k"){it.o=it.o||mkPack(it.p).o;G.pack={p:it.p,o:it.o,idx:i};G.shopMsg="";render();return}
 if(it.k=="j"&&G.jokers.length>=5){G.shopMsg="⚠️ No tenés espacio: vendé un joker primero.";render();return}
 G.money-=it.c;
 if(it.k=="j")G.jokers.push({...it.j,uid:++UID});else G.lv[it.t]++;
 G.shop.splice(i,1);G.shopMsg="";sfx();render();
}
function sell(i){
 if(!G.jokers[i])return;
 G.money+=Math.ceil(G.jokers[i].c/2);G.jokers.splice(i,1);G.shopMsg="Joker vendido.";render();
}
function reroll(){if(G.money<G.rr)return;G.money-=G.rr;G.rr++;fillShop();render()}
function next(){
 G.bi++;
 if(G.bi>2){G.bi=0;G.ante++}
 if(G.ante>8){G.phase="victory";sfx("ganar.mp3");render();return}
 startBlind();
}
const valOf=c=>c.r>13?11:c.r>10?10:c.r;
const chipsOf=c=>valOf(c)+(c.e=="b"?30:0)+(c.rv?25:0);
function multOf(c){const m=(c.e=="m"?4:0)+(c.rv?3:0),t=[m?"+"+m:"",c.e=="g"?"×1.5":""].filter(Boolean).join(" ");return t?`<i class="cv m">${t}</i>`:""}
function cardH(c,i,cls=""){
 if(c.down)return`<div class="card back" onclick="toggle(${i})" title="Boca abajo: tocá para dar vuelta">?</div>`;
 return`<div class="card ${c.s%3==1||c.s==2?"r":""} ${c.e?"e-"+c.e:""} ${c.fl?"flip":""} ${c.rv?"rv":""} ${cls}" ${c.e?`title="${ENH[c.e][0]}: ${ENH[c.e][1]}"`:""} ${cls=="played"?"":`onclick="toggle(${i})"`}>${RK[c.r]||c.r}<span>${SU[c.s]}</span><i class="cv l">+${chipsOf(c)}</i>${multOf(c)}</div>`;
}
function jokersH(shopMode){
 return G.jokers.map((j,i)=>`<div class="joker" ${shopMode?`onclick="sell(${i})" style="cursor:pointer" title="Vender"`:""}><b>${j.n}</b>${j.d}${shopMode?`<br><small>Vender $${Math.ceil(j.c/2)}</small>`:""}</div>`).join("")||"<small>Sin jokers todavía (máx. 5)</small>";
}
const moneyH=()=>`<div class="top"><div class="box" style="max-width:220px;margin:auto"><small>Dinero</small><b class="gold">$${G.money}</b></div></div>`;
function render(){
 document.body.classList.toggle("lost",G.phase=="lost");document.body.classList.toggle("shop",G.phase=="shop");
 const A=$("app"),b=BL[G.bi];
 const head=`<div class="top">
 <div class="box"><small>Ante</small><b>${G.ante}/8</b></div>
 <div class="box"><small>${b[0]}</small><b>Objetivo ${G.target}</b><div class="bar"><i style="width:${Math.min(100,G.score/G.target*100)}%"></i></div></div>
 <div class="box"><small>Puntos</small><b class="gold">${G.score}</b></div>
 <div class="box"><small>Manos / Descartes</small><b><span class="chips">${G.hands}</span> / <span class="mult">${G.disc}</span></b></div>
 <div class="box"><small>Giro 👁️</small><b>${G.flipCd?`⏳ ${G.flipCd} ronda${G.flipCd>1?"s":""}`:"¡Listo!"}</b></div>
 <div class="box"><small>Dinero</small><b class="gold">$${G.money}</b></div></div>`;
 if(G.phase=="victory"){A.innerHTML=`<div class="center"><h1>🏆 ¡Has ganado la partida!</h1><p>Superaste los 8 antes.</p><button class="b3" onclick="newRun()">Jugar de nuevo</button></div>`;return}
 if(G.phase=="shop"){
  if(G.pack){A.innerHTML=moneyH()+packH();return}
  A.innerHTML=`${moneyH()}<h2 class="center">🛒 Tienda <small>(+$${G.payout} de recompensa)</small></h2>
  <div class="row shop">${G.shop.map((it,i)=>`<div class="item"><b>${iN(it)}</b><p>${iD(it)}</p><button class="b3" ${G.money<it.c||(it.k=="j"&&G.jokers.length>=5)?"disabled":""} onclick="buy(${i})">${it.k=="j"&&G.jokers.length>=5?"Sin espacio":it.k=="k"?"Ver · $"+it.c:"Comprar $"+it.c}</button></div>`).join("")||"<small>Agotado</small>"}</div>
  <div class="center"><button class="b4" ${G.money<G.rr?"disabled":""} onclick="reroll()">Reroll $${G.rr}</button> <button class="b1" onclick="next()">Siguiente ronda ▶</button></div>
  <h3 class="center">Tus jokers ${G.jokers.length}/5 (clic para vender)</h3><p class="center gold">${G.shopMsg||""}</p><div class="row">${jokersH(1)}</div>`;return}
 if(G.phase=="won"){
  const base=b[2],hl=G.hands,it=Math.min(5,Math.floor(G.money/5));
  A.innerHTML=`${head}<div class="center win"><h1>🎉 ${G.bi==2?"¡Jefe derrotado!":"¡Ronda ganada!"}</h1><p>Hiciste <b class="gold">${G.score}</b> puntos (objetivo ${G.target})</p>
  <table><tr><td>Recompensa de la ronda</td><td class="gold">+$${base}</td></tr><tr><td>Manos sin usar (${hl})</td><td class="gold">+$${hl}</td></tr><tr><td>Interés</td><td class="gold">+$${it}</td></tr><tr><th>Total</th><th class="gold">+$${base+hl+it}</th></tr></table>
  <p><button class="b3" style="font-size:20px" onclick="cash()">Ir a la tienda ▶</button></p></div>`;return}
 const pv=G.sel.length?calc(G.sel.map(i=>G.hand[i])):null;
 const over=G.phase=="lost"?`<div class="center lostbox"><h2>💀 Derrota</h2><button class="b2" onclick="newRun()">Reintentar</button></div>`:
  G.phase=="won"?`<div class="center"><h2>🎉 ¡Ronda ganada!</h2><button class="b3" onclick="cash()">Cobrar y ir a la tienda</button></div>`:"";
 A.innerHTML=`${head}<div class="row">${jokersH(0)}</div>
 <div class="row" style="min-height:100px">${G.played.map(c=>cardH(c,0,"played")).join("")}</div>
 <div class="info">${pv?`<span class="hname" style="color:${HC[pv.t]}">${HT[pv.t][4]}</span>`:G.msg}</div>
 <div class="row">${G.hand.map((c,i)=>cardH(c,i,G.sel.includes(i)?"sel":"")).join("")}</div>
 ${over||`<div class="center"><button class="b1" ${G.sel.length?"":"disabled"} onclick="play()">Jugar mano</button>
 <button class="b2" ${G.sel.length&&G.disc?"":"disabled"} onclick="discard()">Descartar</button>
 <button class="b4" onclick="sortBy=sortBy=='r'?'s':'r';sortHand();render()">Ordenar: ${sortBy=="r"?"valor":"palo"}</button></div>`}
 <p class="center"><small>Mazo: ${G.deck.length} cartas</small></p>`;
}
const EX={sf:[[9,1],[8,1],[7,1],[6,1],[5,1]],fk:[[10,0],[10,1],[10,2],[10,3],[3,0]],fh:[[13,0],[13,1],[13,2],[4,1],[4,3]],fl:[[14,2],[11,2],[8,2],[5,2],[3,2]],st:[[9,0],[8,1],[7,3],[6,2],[5,0]],tk:[[7,0],[7,1],[7,2],[12,3],[2,1]],tp:[[11,0],[11,3],[6,1],[6,2],[3,0]],pa:[[12,1],[12,3],[9,0],[5,2],[2,1]],hi:[[14,0],[10,3],[8,1],[6,2],[3,3]]};
function handsH(){
 const mc=c=>`<span class="mc ${c.s==1||c.s==2?"r":""}">${RK[c.r]||c.r}${SU[c.s]}</span>`;
 const rows=Object.keys(HT).reverse().map(k=>{
  const h=HT[k],l=G.lv[k],cs=EX[k].map(([r,s])=>({r,s})),sc=ev(cs).sc;
  const mini=cs.map(c=>`<span class="mc ${c.s==1||c.s==2?"r":""} ${sc.includes(c)?"":"dim"}">${RK[c.r]||c.r}${SU[c.s]}</span>`).join("");
  return`<tr><td>${h[4]}</td><td class="mcs">${mini}</td><td>${l}</td><td class="chips">${h[0]+l*h[2]}</td><td class="mult">${h[1]+l*h[3]}</td></tr>`}).join("");
 const pa=HT.pa,l=G.lv.pa,bc=pa[0]+l*pa[2],bm=pa[1]+l*pa[3];
 const ench=G.cards.filter(c=>c.e);
 const en=ench.map(c=>{const v=valOf(c),d={b:`${v} + 30 = <b class="chips">${v+30}</b> fichas`,m:`${v} fichas y <b class="mult">+4</b> multi`,g:`${v} fichas y <b class="mult">×1.5</b> multi`,o:`${v} fichas y <b class="gold">+$2</b>`}[c.e];
  return`<div>${mc(c)} ${ENH[c.e][0]}: ${d}</div>`}).join("");
 return`<h2>📊 Manos y puntaje</h2>
 <h3>¿Cómo se suman los puntos?</h3>
 <p>Ejemplo: jugás <b>${mc({r:12,s:1})} ${mc({r:12,s:3})}</b>, una Pareja.</p>
 <p>① La Pareja empieza con <b class="chips">${bc} Fichas</b> y <b class="mult">${bm} de Multi</b>.</p>
 <p>② Cada Q que puntúa suma sus Fichas: 10 + 10 = <b class="chips">+20 Fichas</b>.</p>
 <p>③ Resultado: <b class="chips">${bc+20} Fichas</b> × <b class="mult">${bm} Multi</b> = <b class="gold">${(bc+20)*bm} puntos</b>.</p>
 <p>Las cartas mejoradas, el Giro 👁️ y los jokers suman más Fichas o Multi antes de multiplicar.</p>
 <h3>Valor de cada carta</h3><p>2 a 10 = su número · J, Q, K = 10 · A = 11.</p>
 <h3>Todas las manos</h3><p><small>En el ejemplo, las cartas apagadas no puntúan.</small></p>
 <table><tr><th>Mano</th><th>Ejemplo</th><th>Nv</th><th>Fichas base</th><th>Multi base</th></tr>${rows}</table>
 <h3>✨ Tus cartas mejoradas (${ench.length})</h3><p>${en||"Todavía ninguna: conseguilas en los sobres Misteriosos de la tienda."}</p>
 <div class="center" style="margin-top:14px"><button class="b3" onclick="closeGuide(false)">Cerrar</button></div>`;
}
function showHands(){const g=$("guide");g.innerHTML=`<div class="g">${handsH()}</div>`;g.style.display="block"}
function showGuide(first){
 const g=$("guide");
 g.innerHTML=`<div class="g"><h2>📖 Guía del juego</h2>
 <h3>🎯 Objetivo</h3><p>Superá 8 <b>antes</b>. Cada ante tiene 3 rondas: Ronda 1, Ronda 2 y Jefe. En cada ronda tenés que llegar a los <b>puntos objetivo</b> usando como máximo 4 manos.</p>
 <h3>🃏 Cartas y manos</h3><p>Tenés 8 cartas. Seleccioná hasta 5 y tocá <b>Jugar mano</b> para formar una mano de póker (pareja, trío, escalera, color, full, póker, escalera de color...). Mientras seleccionás, ves arriba la mano y su puntaje.</p>
 <h3>🔢 Puntaje: Fichas × Multi</h3><p><span class="chips">Fichas</span> = base de la mano + valor de las cartas que puntúan (A=11, J/Q/K=10, el resto su número). <span class="mult">Multi</span> = multiplicador de la mano. Puntos = Fichas × Multi. Solo puntúan las cartas que forman la mano (en una pareja, solo las dos iguales). Abajo de cada carta ves sus <span class="chips">Fichas</span> (izquierda) y su <span class="mult">Multi</span> extra (derecha). Tocá <b>📊 Manos</b> para ver todas las manos con ejemplos.</p>
 <h3>🗑️ Descartes</h3><p>Tenés 3 descartes por ronda: tirá cartas seleccionadas y recibí nuevas, sin gastar manos.</p>
 <h3>🧙 Jokers (máx. 5)</h3><p>Pasivas que modifican el puntaje: dan fichas, multi o X multi según condiciones. Se compran en la tienda y se pueden vender a mitad de precio para liberar espacio.</p>
 <h3>🪐 Planetas</h3><p>Suben de nivel un tipo de mano: más fichas y más multi cada vez. Mirá la tabla de niveles al pie.</p>
 <h3>🎴 Cartas boca abajo y Giro</h3><p>En cualquier ronda algunas cartas llegan boca abajo. Tocalas para darlas vuelta: se pueden girar siempre, y las ocultas van al final de tu mano. Si tu <b>Giro 👁️</b> está listo, la carta que girás recibe un bonus <b>solo esa ronda</b>: +25 Fichas y +3 Multi cuando puntúa. Después el Giro se recarga y vuelve a estar listo tras ganar 2 rondas (lo ves en el panel superior).</p>
 <h3>✨ Mejoras de carta</h3><p>Algunas cartas de tu mazo pueden mejorarse (se ven con color): <b>Carta Gordita</b> +30 fichas, <b>Carta Turbo</b> +4 multi, <b>Carta de Cristal</b> X1.5 multi, <b>Carta Ricachona</b> +$2. Solo actúan cuando la carta puntúa, y se conservan toda la partida.</p>
 <h3>🎁 Sobres</h3><p>En la tienda hay sobres: <b>Cósmico</b> (elegís un planeta), <b>Misterioso</b> (elegís una mejora que se aplica a 2 cartas al azar de tu mazo) y <b>de Bufones</b> (elegís un joker). Tocá <b>Ver</b> para mirar las 3 opciones: solo pagás si elegís una; si no, volvés a la tienda sin gastar.</p>
 <h3>💰 Dinero y tienda</h3><p>Al superar una ronda cobrás $3/$4/$5 según la ronda, +$1 por mano que te sobre y +$1 de interés por cada $5 que tengas (máx. $5). En la tienda comprás jokers y planetas; <b>Reroll</b> renueva las ofertas (el costo sube cada vez).</p>
 <h3>💀 Derrota</h3><p>Si te quedás sin manos sin llegar al objetivo, perdés la partida.</p>
 <div class="center" style="margin-top:14px"><button class="b3" onclick="closeGuide(${first})">${first?"¡Empezar partida!":"Cerrar"}</button></div></div>`;
 g.style.display="block";
}
function closeGuide(first){$("guide").style.display="none";if(first){fadeIntro();newRun()}}
const intro=new Audio("introGame.mp3");intro.volume=.25;intro.loop=true;
const playIntro=()=>{if(intro.currentTime>0)return;intro.play().catch(()=>{})};
function fadeIntro(){const t=setInterval(()=>{if(intro.volume>.03)intro.volume=Math.max(0,intro.volume-.03);else{intro.pause();clearInterval(t)}},150)}
playIntro();["pointerdown","keydown"].forEach(e=>document.addEventListener(e,playIntro,{once:true}));
function startGame(){$("start").style.display="none";showGuide(true)}
(()=>{const f=(x,y,c,n,t)=>`<path d='M${x} ${y-60}L${x+60} ${y}L${x} ${y+60}L${x-60} ${y}Z' fill='none' stroke='%23874a12' stroke-width='2'/><text x='${x}' y='${y+16}' font-size='46' text-anchor='middle' fill='%23${c}' font-family='serif'>${t}</text>`;
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><rect width='240' height='240' fill='%230d0905'/>${f(60,60,"a8611d",0,"♠")}${f(180,60,"a8611d",0,"♥")}${f(60,180,"a8611d",0,"♣")}${f(180,180,"a8611d",0,"♦")}</svg>`;
 document.documentElement.style.setProperty("--shopbg",`url("data:image/svg+xml,${svg.replace(/</g,"%3C").replace(/>/g,"%3E")}")`)})();
(()=>{let t="",f="";
 for(let x=8;x<=92;x+=6)t+=`<path d='M${x} 5l3 6 3-6zM${x} 139l3-6 3 6z' fill='#fff'/>`;
 for(let y=14;y<=128;y+=6)t+=`<path d='M5 ${y}l6 3-6 3zM95 ${y}l-6 3 6 3z' fill='#fff'/>`;
 for(let k=0;k<8;k++)f+=`<ellipse cx='50' cy='57' rx='${k%2?4:6}' ry='${k%2?11:15}' transform='rotate(${k*45} 50 72)' fill='${k%2?"#fff":"none"}' stroke='#fff' stroke-width='1.3'/>`;
 const sc=`<path d='M50 34C34 22 22 38 34 46M50 34C66 22 78 38 66 46M50 34V44' fill='none' stroke='#fff' stroke-width='1.6'/><circle cx='50' cy='46' r='2' fill='#fff'/>`;
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 144'><rect width='100' height='144' rx='7' fill='#25319a'/><rect x='2' y='2' width='96' height='140' rx='6' fill='none' stroke='#fff' stroke-width='2'/>${t}<rect x='14' y='17' width='72' height='110' fill='none' stroke='#fff' stroke-width='1.2'/>${sc}<g transform='rotate(180 50 72)'>${sc}</g>${f}<circle cx='50' cy='72' r='8' fill='#fff'/><circle cx='50' cy='72' r='4' fill='#25319a'/><path d='M30 56v-8h8M70 56v-8h-8M30 88v8h8M70 88v8h-8' fill='none' stroke='#fff' stroke-width='1.5'/></svg>`;
 document.documentElement.style.setProperty("--backbg",`url("data:image/svg+xml,${encodeURIComponent(svg)}")`)})();
G={phase:"intro"};
</script>
</body>
